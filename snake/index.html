<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素贪吃蛇</title>
<meta name="description" content="像素风贪吃蛇——经典街机玩法，越吃越长，不断加速。支持键盘与触屏操作。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%20shape-rendering='crispEdges'%3E%3Crect%20width='16'%20height='16'%20fill='%230c0e13'/%3E%3Crect%20x='6'%20y='1'%20width='4'%20height='2'%20fill='%23a96b3f'/%3E%3Crect%20x='4'%20y='3'%20width='8'%20height='2'%20fill='%233ddc6b'/%3E%3Crect%20x='4'%20y='5'%20width='8'%20height='8'%20fill='%23ff3b5c'/%3E%3Crect%20x='5'%20y='6'%20width='2'%20height='2'%20fill='%23ff8fa5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&display=swap">
<style>
/* ===== 基础 ===== */
:root{
  --bg:#0c0e13;
  --panel:#131720;
  --panel-edge:#232a38;
  --ink:#dbe4ee;
  --ink-dim:#6b7688;
  --green:#3df07a;
  --green-deep:#178a44;
  --green-glow:rgba(61,240,122,.35);
  --red:#ff3b5c;
  --gold:#ffcf3f;
  --pixel:"Press Start 2P","Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;padding:16px;line-height:1.6;
  background-image:
    radial-gradient(ellipse at 50% 0%, #141a26 0%, var(--bg) 65%),
    radial-gradient(ellipse at 50% 120%, #101826 0%, var(--bg) 60%);
}
a{color:inherit}

/* ===== 标题 ===== */
.title{
  font-family:var(--pixel);font-size:clamp(22px,6vw,34px);letter-spacing:.06em;
  color:var(--green);text-shadow:0 0 12px var(--green-glow),0 3px 0 #0a3a1f;
  margin:0 0 14px;text-align:center;
}

/* ===== 计分条 ===== */
.hud{
  width:min(92vw,440px);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  font-family:var(--pixel);color:var(--ink-dim);margin-bottom:10px;
}
.hud .side{font-size:11px;padding-bottom:5px;white-space:nowrap}
.hud .side b{color:var(--green);font-weight:400}
.hud .hi{color:var(--gold)}
.hud .hi b{color:var(--gold)}
.score-box{display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1}
.score-label{font-size:9px;color:var(--ink-dim);letter-spacing:.18em}
.score-box b{font-size:26px;color:var(--green);font-weight:400;text-shadow:0 0 12px var(--green-glow);display:inline-block}
#score.bump{animation:scoreBump .28s ease}
@keyframes scoreBump{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.combo{
  width:min(92vw,440px);display:flex;align-items:center;gap:10px;margin-bottom:10px;
  font-family:var(--pixel);font-size:9px;color:var(--ink-dim);
}
.combo[hidden]{display:none}
.combo-x{white-space:nowrap}
.combo-x b{color:var(--green);font-weight:400}
.combo-bar{flex:1;height:7px;background:#1a2130;border:1px solid var(--panel-edge)}
.combo-fill{display:block;height:100%;background:var(--green);width:0%}

/* ===== 游戏舞台 ===== */
.stage{
  position:relative;width:min(92vw,440px);
  background:var(--panel);border:4px solid var(--panel-edge);padding:8px;
  box-shadow:0 0 0 1px #0a0c10,0 14px 40px rgba(0,0,0,.5),inset 0 0 24px rgba(0,0,0,.35);
}
canvas{
  display:block;width:100%;height:auto;aspect-ratio:1;
  image-rendering:pixelated;image-rendering:crisp-edges;
  background:#0b0d12;touch-action:none;
}
/* 扫描线 */
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
  mix-blend-mode:screen;
}

/* ===== 覆盖层 ===== */
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,10,14,.82);text-align:center;padding:20px;gap:14px;z-index:5;
}
.overlay.hidden{display:none}
.ov-title{font-family:var(--pixel);font-size:20px;color:var(--green);text-shadow:0 0 10px var(--green-glow);margin:0}
.ov-sub{font-size:13px;color:var(--ink-dim);margin:0;max-width:26em}
.ov-score{font-family:var(--pixel);font-size:14px;color:var(--ink);margin:0}
.ov-score b{color:var(--gold);font-weight:400}

/* ===== 按钮 ===== */
.btn{
  font-family:var(--pixel);font-size:12px;color:#0a2414;background:var(--green);
  border:0;padding:13px 26px;cursor:pointer;box-shadow:0 4px 0 #0a3a1f,0 6px 14px rgba(0,0,0,.4);
  transition:transform .06s ease,box-shadow .06s ease;user-select:none;
}
.btn:hover{background:#5dff99}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a3a1f}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:0 4px 0 var(--panel-edge),0 6px 14px rgba(0,0,0,.3);border:1px solid var(--panel-edge)}
.btn.ghost:hover{color:var(--green);border-color:var(--green)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ===== 操作区 ===== */
.controls{width:min(92vw,440px);margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hint{font-size:12px;color:var(--ink-dim);margin:0;line-height:1.8}
.hint kbd{
  font-family:var(--pixel);font-size:9px;background:#1a2130;border:1px solid var(--panel-edge);
  border-bottom-width:3px;padding:3px 6px;color:var(--ink);
}
.pause-btn{font-family:var(--pixel);font-size:10px;color:var(--ink);background:transparent;border:1px solid var(--panel-edge);padding:9px 14px;cursor:pointer}
.pause-btn:hover{color:var(--green);border-color:var(--green)}

/* ===== 十字键（触屏） ===== */
.dpad{display:none;width:min(92vw,440px);margin-top:10px;justify-content:center}
.dpad-grid{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px}
.dpad button{
  font-family:var(--pixel);font-size:12px;color:var(--ink);background:#1a2130;
  border:1px solid var(--panel-edge);cursor:pointer;user-select:none;
}
.dpad button:hover{color:var(--green);border-color:var(--green)}
.dpad button:active{background:#24304a}
.dpad .u{grid-column:2;grid-row:1}
.dpad .l{grid-column:1;grid-row:2}
.dpad .r{grid-column:3;grid-row:2}
.dpad .d{grid-column:2;grid-row:3}
.dpad .dot{grid-column:2;grid-row:2}

.foot{margin-top:14px;font-size:11px;color:#3c4554;text-align:center}

/* ===== 响应式 ===== */
@media (pointer:coarse),(max-width:640px){
  .dpad{display:flex}
  .hint-desktop{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<h1 class="title">SNAKE</h1>

<div class="hud">
  <span class="side">LV <b id="level">1</b></span>
  <span class="score-box">
    <span class="score-label">SCORE</span>
    <b id="score">0</b>
  </span>
  <span class="side hi">HI <b id="hi">0</b></span>
</div>
<div class="combo" id="combo-wrap" hidden>
  <span class="combo-x">COMBO ×<b id="combo">1</b></span>
  <span class="combo-bar"><span class="combo-fill" id="combo-fill"></span></span>
</div>

<div class="stage">
  <canvas id="game" width="352" height="352" aria-label="贪吃蛇游戏区域"></canvas>

  <!-- 开始 -->
  <div class="overlay" id="ov-start">
    <p class="ov-title">像素贪吃蛇</p>
    <p class="ov-sub">吃食物得分，连续快吃叠加连击倍率；每 5 个食物出现金色奖励果 +50 分。别撞墙、别咬到自己。</p>
    <button class="btn" id="btn-start">开始游戏</button>
    <button class="btn ghost" id="btn-ai">AI 演示</button>
    <button class="btn ghost" id="btn-reset-hi-start">重置最高分</button>
    <p class="ov-sub">方向键 / WASD 控制</p>
  </div>

  <!-- 暂停 -->
  <div class="overlay hidden" id="ov-pause">
    <p class="ov-title">已暂停</p>
    <div class="btn-row">
      <button class="btn" id="btn-resume">继续</button>
      <button class="btn ghost" id="btn-restart-p">重新开始</button>
    </div>
  </div>

  <!-- 结束 -->
  <div class="overlay hidden" id="ov-over">
    <p class="ov-title">游戏结束</p>
    <p class="ov-score">得分 <b id="final-score">0</b></p>
    <p class="ov-score">最高 <b id="final-hi">0</b></p>
    <button class="btn" id="btn-restart">再来一局</button>
    <button class="btn ghost" id="btn-reset-hi-over">重置最高分</button>
  </div>
</div>

<div class="controls">
  <p class="hint hint-desktop"><kbd>↑↓←→</kbd> / <kbd>WASD</kbd> 移动 · <kbd>空格</kbd> 开始/暂停 · <kbd>R</kbd> 重开</p>
  <p class="hint" style="display:none" id="hint-mobile">滑动屏幕或使用十字键控制</p>
  <button class="pause-btn" id="btn-pause">暂停</button>
</div>

<!-- 十字键 -->
<div class="dpad">
  <div class="dpad-grid" aria-label="方向控制">
    <button class="u" data-dir="up" aria-label="上">▲</button>
    <button class="l" data-dir="left" aria-label="左">◀</button>
    <button class="r" data-dir="right" aria-label="右">▶</button>
    <button class="d" data-dir="down" aria-label="下">▼</button>
    <span class="dot"></span>
  </div>
</div>

<p class="foot">像素贪吃蛇 · 单文件 HTML · 键盘与触屏均可玩</p>

<script>
(function(){
'use strict';

/* ===== 常量与状态 ===== */
var COLS=22, ROWS=22, CELL=16;
var canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
var state='start'; /* start | playing | paused | over */
var snake=[], dir={x:1,y:0}, queue=[], food=null, bonus=null, bonusDeadline=0;
var score=0, hi=0, speed=150, acc=0, last=0;
var combo=1, comboTimer=0, level=1, foodsEaten=0, popups=[];
var aiOn=false, autoplayCap=0, timerDrive=false;
var FOOD_PTS=10, GOLD_PTS=50, COMBO_WINDOW=5000, COMBO_MAX=5;
var HI_KEY='snake_pixel_hi';
var actx=null;

try{ hi=parseInt(localStorage.getItem(HI_KEY)||'0',10)||0; }catch(e){ hi=0; }
document.getElementById('hi').textContent=hi;

/* ===== 音效（WebAudio，首次交互后启用） ===== */
function tone(f,dur,type,vol){
  if(!actx) return;
  try{
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.04, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function initAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
document.addEventListener('pointerdown', initAudio, {once:true});
document.addEventListener('keydown', initAudio, {once:true});

/* ===== 工具 ===== */
function inBounds(x,y){ return x>0 && y>0 && x<COLS-1 && y<ROWS-1; }
function emptyCells(){
  var occ={};
  for(var i=0;i<snake.length;i++){ var s=snake[i]; occ[s.x+','+s.y]=1; }
  if(food) occ[food.x+','+food.y]=1;
  if(bonus) occ[bonus.x+','+bonus.y]=1;
  var list=[];
  for(var y=1;y<ROWS-1;y++) for(var x=1;x<COLS-1;x++) if(!occ[x+','+y]) list.push({x:x,y:y});
  return list;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ===== 汉密尔顿回路（占满全屏策略） =====
   在 20×20 内部格构造一条闭合环路，每格恰好经过一次。
   蛇头沿环路前进 → 永不撞墙/撞自己，最终占满全屏。 */
var cycle={};
function buildCycle(){
  cycle={};
  var N=COLS-2; /* 20，内部格 x,y ∈ 1..20 */
  function lk(a,b){ cycle[a.x+','+a.y]=b; }
  /* y=1: 左→右 */
  for(var x=2;x<=N;x++) lk({x:x-1,y:1},{x:x,y:1});
  lk({x:N,y:1},{x:N,y:2});
  /* y=2..19: 锯齿，x=1 留作回程列 */
  for(var y=2;y<=N-1;y++){
    if(y%2===0){ /* 右→左到 x=2 */
      for(var x=N;x>=3;x--) lk({x:x,y:y},{x:x-1,y:y});
      lk({x:2,y:y},{x:2,y:y+1});
    }else{ /* 左→右到 x=N */
      for(var x=3;x<=N;x++) lk({x:x-1,y:y},{x:x,y:y});
      lk({x:N,y:y},{x:N,y:y+1});
    }
  }
  /* y=20: 右→左到 x=1 */
  for(var x=N;x>=2;x--) lk({x:x,y:N},{x:x-1,y:N});
  /* 回程列: (1,20)→(1,19)→…→(1,2)→(1,1) */
  for(var y=N-1;y>=2;y--) lk({x:1,y:y+1},{x:1,y:y});
  lk({x:1,y:2},{x:1,y:1});
}
buildCycle();

/* ===== 游戏流程 ===== */
function reset(){
  snake=[{x:10,y:11},{x:9,y:11},{x:8,y:11}];
  dir={x:1,y:0}; queue=[];
  food=null; bonus=null; bonusDeadline=0;
  score=0; speed=150; acc=0;
  combo=1; comboTimer=0; level=1; foodsEaten=0; popups=[];
  document.getElementById('score').textContent='0';
  document.getElementById('level').textContent='1';
  updateComboUI();
  placeFood();
}
function placeFood(){
  var list=emptyCells();
  if(!list.length) return;
  food=pick(list);
}
function placeBonus(){
  var list=emptyCells();
  if(!list.length) return;
  bonus=pick(list);
  bonusDeadline=performance.now()+6000;
}
function setDir(d){
  if(state!=='playing') return;
  var lastDir=queue.length?queue[queue.length-1]:dir;
  if(d.x===-lastDir.x && d.y===-lastDir.y) return;
  if(d.x===lastDir.x && d.y===lastDir.y) return;
  if(queue.length<2) queue.push(d);
}
function step(){
  if(queue.length) dir=queue.shift();
  var head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(!inBounds(head.x,head.y)){ die(); return; }
  for(var i=0;i<snake.length;i++){
    if(snake[i].x===head.x && snake[i].y===head.y){ die(); return; }
  }
  snake.unshift(head);
  var ate=false;
  if(food && head.x===food.x && head.y===food.y){
    ate=true;
    var fx=food.x, fy=food.y;   /* 先记录位置再置空，避免后续取 food.x 报错 */
    food=null;
    foodsEaten+=1;
    var gained=FOOD_PTS*combo;
    score+=gained; combo=Math.min(COMBO_MAX,combo+1); comboTimer=COMBO_WINDOW;
    popups.push({x:fx,y:fy,text:'+'+gained,color:'#3df07a',born:performance.now()});
    tone(560,0.07,'square');
    if(foodsEaten%5===0) placeBonus();
    placeFood();
    if(speed>70) speed=Math.max(70,speed-5);
  }else if(bonus && head.x===bonus.x && head.y===bonus.y){
    ate=true;
    var bx=bonus.x, by=bonus.y;
    bonus=null; bonusDeadline=0;
    score+=GOLD_PTS; combo=Math.min(COMBO_MAX,combo+1); comboTimer=COMBO_WINDOW;
    popups.push({x:bx,y:by,text:'+'+GOLD_PTS,color:'#ffcf3f',born:performance.now()});
    tone(880,0.1,'square',0.05);
    if(speed>70) speed=Math.max(70,speed-5);
  }
  if(ate){ updateScoreUI(); checkLevel(); }
  if(!ate) snake.pop();
}
function updateScoreUI(){
  var el=document.getElementById('score');
  el.textContent=score;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  updateComboUI();
}
function updateComboUI(){
  document.getElementById('combo').textContent=combo;
  var wrap=document.getElementById('combo-wrap'), fill=document.getElementById('combo-fill');
  if(comboTimer>0 && combo>1){
    wrap.hidden=false;
    fill.style.width=Math.min(100,comboTimer/COMBO_WINDOW*100)+'%';
  }else{
    wrap.hidden=true; fill.style.width='0%';
  }
}
function checkLevel(){
  var nl=1+Math.floor(score/100);
  if(nl>level){
    level=nl;
    document.getElementById('level').textContent=level;
    if(!aiOn) speed=Math.max(60,speed-10); /* AI 模式锁定速度 */
    popups.push({x:11,y:11,text:'LEVEL '+level,color:'#ffcf3f',born:performance.now(),big:true});
    tone(660,0.08,'square',0.05);
    setTimeout(function(){ tone(990,0.1,'square',0.05); },90);
  }
}
function die(){
  state='over';
  aiOn=false;
  tone(220,0.18,'sawtooth',0.05);
  setTimeout(function(){ tone(160,0.28,'sawtooth',0.05); },120);
  if(score>hi){
    hi=score;
    try{ localStorage.setItem(HI_KEY,String(hi)); }catch(e){}
  }
  /* 无头自跑模式：把最终得分写入标题供外部读取 */
  if(timerDrive) document.title='AUTOPLAY-SCORE '+score;
  /* 结算时让顶部分数与弹窗一致，并清掉残留的连击条 */
  document.getElementById('score').textContent=score;
  comboTimer=0; combo=1; updateComboUI();
  document.getElementById('final-score').textContent=score;
  document.getElementById('final-hi').textContent=hi;
  document.getElementById('hi').textContent=hi;
  show('ov-over');
}
function startGame(){
  aiOn=false;
  reset();
  state='playing';
  hide('ov-start'); hide('ov-pause'); hide('ov-over');
}
function startAI(){
  startGame();
  /* 把蛇放到环路起点：(3,1)→(2,1)→(1,1)，朝右走 */
  snake=[{x:3,y:1},{x:2,y:1},{x:1,y:1}];
  dir={x:1,y:0}; queue=[];
  speed=15; /* AI 模式快速跑，约 7 分钟占满全屏 */
  aiOn=true;
}
function togglePause(){
  if(state==='playing'){ state='paused'; show('ov-pause'); }
  else if(state==='paused'){ state='playing'; hide('ov-pause'); }
}

/* ===== 覆盖层 ===== */
function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }

/* ===== 渲染：像素画 ===== */
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }

function render(){
  var W=canvas.width, H=canvas.height;
  /* 背景 */
  ctx.fillStyle='#0b0d12'; ctx.fillRect(0,0,W,H);
  /* 边框墙 */
  ctx.fillStyle='#182030'; ctx.fillRect(0,0,W,CELL); ctx.fillRect(0,H-CELL,W,CELL);
  ctx.fillRect(0,0,CELL,H); ctx.fillRect(W-CELL,0,CELL,H);
  px(CELL,CELL,W-2*CELL,1,'#263a3a'); px(CELL,H-CELL-1,W-2*CELL,1,'#263a3a');
  px(CELL,CELL,1,H-2*CELL,'#263a3a'); px(W-CELL-1,CELL,1,H-2*CELL,'#263a3a');
  /* 网格 */
  ctx.strokeStyle='rgba(255,255,255,.045)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(var x=CELL;x<W-CELL;x+=CELL){ ctx.moveTo(x+.5,CELL); ctx.lineTo(x+.5,H-CELL); }
  for(var y=CELL;y<H-CELL;y+=CELL){ ctx.moveTo(CELL,y+.5); ctx.lineTo(W-CELL,y+.5); }
  ctx.stroke();

  /* 食物（像素苹果） */
  if(food) drawApple(food.x,food.y);
  /* 奖励果 */
  if(bonus && performance.now()<bonusDeadline) drawBonus(bonus.x,bonus.y);
  else if(bonus){ bonus=null; bonusDeadline=0; }

  /* 蛇 */
  for(var i=snake.length-1;i>=0;i--) drawSeg(snake[i].x,snake[i].y,i===0);

  /* 得分飘字 */
  var now=performance.now();
  for(var j=popups.length-1;j>=0;j--){
    var p=popups[j], age=now-p.born;
    if(age>900){ popups.splice(j,1); continue; }
    ctx.globalAlpha=1-age/900;
    ctx.fillStyle=p.color;
    ctx.font=(p.big?'10px':'8px')+' "Press Start 2P","Courier New",monospace';
    var tw=ctx.measureText(p.text).width;
    ctx.fillText(p.text, p.x*CELL+(CELL-tw)/2, p.y*CELL+9-age*0.014);
  }
  ctx.globalAlpha=1;
}

function drawApple(x,y){
  var X=x*CELL, Y=y*CELL;
  px(X+5,Y+1,6,3,'#a96b3f');       /* 柄 */
  px(X+3,Y+3,9,2,'#3ddc6b');       /* 叶 */
  px(X+4,Y+4,9,9,'#ff3b5c');       /* 果身 */
  px(X+5,Y+6,3,3,'#ff8fa5');       /* 高光 */
  px(X+10,Y+11,2,2,'#c91f40');     /* 暗部 */
}
function drawBonus(x,y){
  var X=x*CELL, Y=y*CELL, blink=Math.floor(performance.now()/160)%2===0;
  px(X+5,Y+5,6,6,blink?'#ffe08a':'#ffcf3f');
  px(X+7,Y+7,2,2,'#fff7dd');
}
function drawSeg(x,y,isHead){
  var X=x*CELL, Y=y*CELL;
  px(X,Y,CELL,CELL,'#178a44');          /* 轮廓 */
  px(X+2,Y+2,CELL-4,CELL-4,'#2fe06b');  /* 主体 */
  px(X+2,Y+2,CELL-7,CELL-7,'#63ff9c');  /* 高光 */
  if(isHead) drawHead(x,y);
}
function drawHead(x,y){
  var X=x*CELL, Y=y*CELL;
  var eyeF=4, eyeW=4, eyeH=4, pup=2;
  function eye(ex,ey,pxo,pyo){
    ctx.fillStyle='#f4fdf7'; ctx.fillRect(Math.round(X+ex),Math.round(Y+ey),eyeW,eyeH);
    ctx.fillStyle='#0a120c'; ctx.fillRect(Math.round(X+ex+pxo),Math.round(Y+ey+pyo),pup,pup);
  }
  /* 眼睛位置随方向 */
  if(dir.x>0){ eye(CELL-7,3,2,1); eye(CELL-7,CELL-7,2,1); }
  else if(dir.x<0){ eye(3,3,0,1); eye(3,CELL-7,0,1); }
  else if(dir.y<0){ eye(3,3,1,0); eye(CELL-7,3,1,0); }
  else{ eye(3,CELL-7,1,2); eye(CELL-7,CELL-7,1,2); }
  /* 舌尖 */
  if(dir.x>0) px(X+CELL-2,Y+CELL/2-1,2,3,'#ff3b5c');
  if(dir.x<0) px(X,Y+CELL/2-1,2,3,'#ff3b5c');
  if(dir.y>0) px(X+CELL/2-1,Y+CELL-2,3,2,'#ff3b5c');
  if(dir.y<0) px(X+CELL/2-1,Y,3,2,'#ff3b5c');
}

/* ===== 主循环 ===== */
function loop(ts){
  requestAnimationFrame(loop);
  if(state==='playing'){
    if(!last) last=ts;
    var dt=ts-last; last=ts;
    if(dt>200) dt=200;
    acc+=dt;
    if(!timerDrive){
      while(acc>=speed){
        if(aiOn) aiStep();
        acc-=speed; step();
        if(state!=='playing') break;
      }
    }
    /* 连击计时 */
    if(comboTimer>0){
      comboTimer-=dt;
      if(comboTimer<=0){ combo=1; comboTimer=0; }
      updateComboUI();
    }
  }
  render();
}
requestAnimationFrame(loop);

/* ===== AI 自动游玩（汉密尔顿回路） =====
   预计算遍历全部 400 格的闭合环路，蛇头每步沿环路走一格。
   蛇身始终是环路连续段 → 永不撞墙/撞自己，最终占满全屏。 */
function aiStep(){
  if(state!=='playing') return;
  var h=snake[0];
  var nxt=cycle[h.x+','+h.y];
  if(!nxt) return;
  setDir({x:nxt.x-h.x, y:nxt.y-h.y});
}

/* ===== 输入：键盘 ===== */
var KEYMAP={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
            KeyW:{x:0,y:-1},KeyS:{x:0,y:1},KeyA:{x:-1,y:0},KeyD:{x:1,y:0}};
document.addEventListener('keydown',function(e){
  var k=e.code;
  if(KEYMAP[k]){ e.preventDefault(); setDir(KEYMAP[k]); return; }
  if(k==='Space'){
    e.preventDefault();
    if(state==='start'||state==='over') startGame();
    else togglePause();
    return;
  }
  if(k==='KeyP'){ e.preventDefault(); if(state==='playing'||state==='paused') togglePause(); return; }
  if(k==='KeyR'){ e.preventDefault(); startGame(); return; }
  if(k==='Enter'){
    if(state==='start'||state==='over') startGame();
    return;
  }
},false);

/* ===== 输入：触屏滑动 ===== */
var touchStart=null;
canvas.addEventListener('touchstart',function(e){
  var t=e.changedTouches[0]; touchStart={x:t.clientX,y:t.clientY};
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',function(e){
  if(!touchStart) return;
  var t=e.changedTouches[0], dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
  touchStart=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<18) return;
  if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?{x:1,y:0}:{x:-1,y:0});
  else setDir(dy>0?{x:0,y:1}:{x:0,y:-1});
  e.preventDefault();
},{passive:false});

/* ===== 输入：十字键 ===== */
var DPAD={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
document.querySelectorAll('.dpad button').forEach(function(b){
  b.addEventListener('pointerdown',function(e){
    e.preventDefault(); setDir(DPAD[b.getAttribute('data-dir')]);
  });
});

/* ===== 按钮 ===== */
document.getElementById('btn-start').addEventListener('click',startGame);
document.getElementById('btn-resume').addEventListener('click',function(){ togglePause(); });
document.getElementById('btn-pause').addEventListener('click',function(){
  if(state==='playing') togglePause();
  else if(state==='paused') togglePause();
});
document.getElementById('btn-restart').addEventListener('click',startGame);
document.getElementById('btn-restart-p').addEventListener('click',startGame);
document.getElementById('btn-ai').addEventListener('click',startAI);

/* 重置最高分：历史记录从零开始 */
function resetHi(btn){
  hi=0;
  try{ localStorage.setItem(HI_KEY,'0'); }catch(e){}
  document.getElementById('hi').textContent='0';
  document.getElementById('final-hi').textContent='0';
  var old=btn.textContent;
  btn.textContent='已清零';
  setTimeout(function(){ btn.textContent=old; },1200);
}
document.getElementById('btn-reset-hi-start').addEventListener('click',function(){ resetHi(this); });
document.getElementById('btn-reset-hi-over').addEventListener('click',function(){ resetHi(this); });

/* 切后台自动暂停 */
document.addEventListener('visibilitychange',function(){
  if(document.hidden && state==='playing') togglePause();
});

/* 开始画面先画一帧 */
reset();
/* 自检模式：带 ?auto 打开时自动开局并定格棋盘（不弹覆盖层），便于截图验证 */
if(location.search.indexOf('auto')>=0){
  setTimeout(function(){
    startGame();
    state='paused';
  },120);
}
/* 无头自跑模式：带 ?autoplay 打开时由 AI 自己玩；默认冲到 2000 分定格，?autoplay&nocap 则玩到自然死亡。
   虚拟时间环境下 rAF 不驱动，改用固定 16ms 定时器驱动步进 */
if(location.search.indexOf('autoplay')>=0){
  timerDrive=true;
  if(location.search.indexOf('nocap')<0) autoplayCap=2000;
  setTimeout(function(){
    startAI();
    setInterval(function(){
      if(!(aiOn && state==='playing')) return;
      acc+=16;
      while(acc>=speed){
        aiStep(); acc-=speed; step();
        if(state!=='playing') break;
      }
      if(autoplayCap>0 && aiOn && score>=autoplayCap){
        aiOn=false; state='paused';
        document.title='AUTOPLAY-SCORE '+score;
      }
    },16);
  },150);
}
/* 逻辑自检：带 ?autotest 打开时执行确定性吃果实测试，结果写入页面标题 */
if(location.search.indexOf('autotest')>=0){
  setTimeout(function(){
    try{
      startGame();
      state='paused';                    /* 冻结主循环，手动驱动 step */
      snake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}];
      dir={x:1,y:0}; queue=[];
      combo=1; comboTimer=0; foodsEaten=4; score=0; speed=150; acc=0;
      food={x:6,y:5};
      step();                            /* 吃掉第 1 个食物 */
      var ok1=food!==null;               /* 果实重新生成 */
      var ok2=score===FOOD_PTS;          /* 基础得分 */
      var ok3=popups.length===1;         /* 飘字生成 */
      var ok4=document.getElementById('score').textContent==='10'; /* HUD 同步 */
      var ok5=bonus!==null;              /* 第 5 个食物触发奖励果 */
      food={x:2,y:2};                    /* 移开食物，避免挡住下一步 */
      bonus={x:7,y:5}; bonusDeadline=performance.now()+6000;
      step();                            /* 吃掉奖励果 */
      var ok6=bonus===null && score===FOOD_PTS+GOLD_PTS;
      var ok7=popups.length===2;
      var pass=ok1&&ok2&&ok3&&ok4&&ok5&&ok6&&ok7;
      document.title=pass?'AUTOTEST-PASS':'AUTOTEST-FAIL '+[ok1,ok2,ok3,ok4,ok5,ok6,ok7].map(String).join('');
    }catch(err){
      document.title='AUTOTEST-EXC '+err.message;
    }
  },150);
}
})();
</script>
